name: Build MoKee x2 kernel (BakaSU + Droidspaces)

on:
  push:
    branches: [mokee10-pids, mokee10-bakasu-droidspaces]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev make zip python3

      - name: Download GCC 4.9 toolchain
        run: |
          git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          cd anykernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=x2/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot|' anykernel.sh
          rm -rf .git README.md LICENSE .github

      - name: Suppress git dirty marker
        run: echo -n "" > .scmversion

      - name: Verify BakaSU + pids integration
        run: |
          test -f drivers/kernelsu/Kconfig
          grep -q 'obj-$(CONFIG_KSU)' drivers/Makefile
          test -f kernel/cgroup_pids.c
          grep -q 'obj-$(CONFIG_CGROUP_PIDS)' kernel/Makefile
          grep -q 'config CGROUP_PIDS' init/Kconfig

      - name: Build kernel
        run: |
          export PATH=$PATH:$(pwd)/toolchain/bin
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          make O=out mrproper
          make O=out mokee_x2_defconfig
          make O=out olddefconfig
          grep -E '^CONFIG_KSU_MANUAL_HOOK=y|^CONFIG_CGROUP_PIDS=y' out/.config
          make O=out HOSTCFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -fcommon" -j$(nproc)
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Package AnyKernel3 zip
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb anykernel3/
          cd anykernel3
          zip -r9 ../MoKee10-x2-BakaSU-Droidspaces-pids.zip * -x '*.git*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoKee10-x2-BakaSU-Droidspaces-pids
          path: MoKee10-x2-BakaSU-Droidspaces-pids.zip
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bakasu-droidspaces-pids-${{ github.run_number }}
          name: "MoKee10 x2 — BakaSU + Droidspaces + pids Build #${{ github.run_number }}"
          body: |
            ## MoKee 10 (mkq-mr1) kernel for LeEco Max 2 (x2)

            - BakaSU（manual hook，无 KPM / 无 SUSFS）
            - Droidspaces 容器支持（namespaces / cgroup v1 / veth / macvlan / NAT）
            - **CONFIG_CGROUP_PIDS**（Process limit / `--pids-limit`），stage 3 backport
            - `pids.max` / `pids.current` 已实机验证

            刷入方式：AnyKernel3 卡刷包（Recovery 刷入 boot 分区）
          files: |
            MoKee10-x2-BakaSU-Droidspaces-pids.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
